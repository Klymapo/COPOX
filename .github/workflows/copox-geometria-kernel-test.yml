name: COPOX Geometry Kernel Tests
on:
  push:
    branches: [propuesta/cassette-geometria-guiada]
    paths:
      - 'copox/geometry/**'
      - 'tests/test_geometry_kernel.py'
      - '.github/workflows/copox-geometria-kernel-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s tests -p 'test_geometry_kernel.py' -v
