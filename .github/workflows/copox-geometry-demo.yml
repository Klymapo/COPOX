name: COPOX Geometry Demo - Scully Cut Stitch
on:
  push:
    branches: [propuesta/cassette-geometria-guiada]
    paths:
      - 'tools/geometry/demo_operations.py'
      - '.github/workflows/copox-geometry-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: python -m pip install numpy scipy pillow
      - name: Run mathematical operations on original synthetic geometry
        run: |
          python -m tools.geometry.demo_operations
          python -m unittest discover -s tests -p 'test_geometry_operations.py' -v
      - name: Upload real rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometry-synthetic-demo
          path: docs/geometry/demo/
          if-no-files-found: error
          retention-days: 30
      - name: Version evidence only on experimental branch
        run: |
          git config user.name "COPOX CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geometry/demo/
          if ! git diff --cached --quiet; then
            git commit -m "evidence(geometry): three synthetic operators PNG GLB JSON"
            git pull --rebase origin propuesta/cassette-geometria-guiada
            git push origin HEAD:propuesta/cassette-geometria-guiada
          fi
