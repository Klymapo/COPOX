name: COPOX · G2-B · Reconstrucción craneofacial
on:
  push:
    branches: [experimentos/maniqui-g2b-piel-craneofacial]
    paths:
      - 'copox/geometry/craniofacial_loft.py'
      - 'tests/test_g2b_craniofacial_loft.py'
      - 'tools/maniqui/g2b_shell_candidates.py'
      - '.github/workflows/maniqui-g2b.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: copox-g2b-craniofacial
  cancel-in-progress: true
jobs:
  g2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas libres
        run: python -m pip install numpy scipy pillow trimesh
      - name: Gates matemáticos antes de render
        run: |
          python -m unittest discover -s tests -p 'test_g2b_craniofacial_loft.py' -v
          python -m unittest discover -s tests -p 'test_g2_contour_graph.py' -v
          python -m unittest discover -s tests -p 'test_g2_anatomic_roi.py' -v
      - name: 'Generar 3 GLB candidatos de reconstrucción sobre r3 ORIGINAL'
        run: |
          python -m tools.maniqui.g2b_shell_candidates
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=json.loads(Path('docs/maniqui/g2b/G2B_reporte.json').read_text())
          assert d['status']=='CANDIDATES_EXPERIMENTAL_NOT_APPROVED'
          assert len(d['variants'])==5
          for v in d['variants']:
              assert hashlib.sha256(Path(v['glb']).read_bytes()).hexdigest()==v['sha256']
              assert v['new_shell_watertight_as_one_primitive']
              assert not v['original_face_to_new_shell_welded']
              assert v['bones']==56 and v['clips']==29
          print('Tres cascarones craneales comparten índices y están cerrados tras reimportar')
          PY
      - name: Reimportación independiente de los GLB con Trimesh
        run: |
          python - <<'PY'
          import json,trimesh
          from pathlib import Path
          d=json.loads(Path('docs/maniqui/g2b/G2B_reporte.json').read_text())
          for v in d['variants']:
              scene=trimesh.load(v['glb'],force='scene')
              assert len(scene.geometry)>0
              print(v['name'],len(scene.geometry),'mallas GLB reimportadas')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g2b-candidatos-glb-y-comparacion-original
          path: |
            assets/maniqui/maniqui_v0_3_r3_g2b_*.glb
            docs/maniqui/g2b/
          if-no-files-found: error
          retention-days: 30
      - name: 'Publicar sólo captura y reporte, no promocionar GLB automáticamente'
        run: |
          git config user.name "COPOX CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maniqui/g2b/G2B_lamina_4v_candidatos.png docs/maniqui/g2b/G2B_reporte.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(g2b): 3 cascarones conectados, preview real y topología medida"
            git pull --rebase origin experimentos/maniqui-g2b-piel-craneofacial
            git push origin HEAD:experimentos/maniqui-g2b-piel-craneofacial
          fi
