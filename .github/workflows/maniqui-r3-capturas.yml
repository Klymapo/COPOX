name: COPOX · R3 · Capturas reales
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - evidencia/maniqui-v03-r3-png
    paths:
      - '.github/workflows/maniqui-r3-capturas.yml'
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias gratuitas
        run: python -m pip install numpy scipy pillow
      - name: Regenerar r3 desde v0.3 y comprobar identidad binaria
        run: |
          mkdir -p "$RUNNER_TEMP/copox-replica"
          python tools/maniqui/reconstruir_v03.py assets/maniqui/maniqui_v0_3.glb "$RUNNER_TEMP/copox-replica/maniqui_v0_3_r3.glb" "$RUNNER_TEMP/copox-replica/build.json" --iteration 3
          python tools/maniqui/auditar_v03.py assets/maniqui/maniqui_v0_3.glb "$RUNNER_TEMP/copox-replica/auditoria.json" "$RUNNER_TEMP/copox-replica/maniqui_v0_3_r3.glb"
          python - <<'PY'
          import hashlib, json, os, pathlib
          original=pathlib.Path('assets/maniqui/maniqui_v0_3_r3.glb')
          replica=pathlib.Path(os.environ['RUNNER_TEMP'])/'copox-replica/maniqui_v0_3_r3.glb'
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          base=pathlib.Path('assets/maniqui/maniqui_v0_3.glb')
          expected='3aec25dd8c9f758bc7b092806caf159efb073be71bbba6615c2905c692f6dd0b'
          same=digest(original)==digest(replica)==expected
          result={'fecha':'2026-10-14','metodo':'Regeneracion desde la base original con scripts de Codex, sin editar GLB','script':'tools/maniqui/reconstruir_v03.py --iteration 3','base_sha256':digest(base),'original_sha256':digest(original),'replica_sha256':digest(replica),'identicos_byte_por_byte':same,'verificacion_auditoria':json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'copox-replica/auditoria.json').read_text())['candidates'][0],'estado':'REPRODUCIDO SIN APROBACION ARTISTICA' if same else 'DIFERENCIA: no promocionar'}
          out=pathlib.Path('docs/MANIQUI_V03_R3_REPRODUCCION_ARGOS_2026-10-14.json')
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='verificacion_auditoria'},indent=2,ensure_ascii=False))
          if not same:raise SystemExit('La version regenerada no coincide con Codex')
          PY
      - name: Render original r3
        run: |
          python tools/maniqui/render.py assets/maniqui/maniqui_v0_3_r3.glb assets/maniqui/previews/maniqui_v0_3_r3_4vistas.png
          python tools/maniqui/pose.py assets/maniqui/maniqui_v0_3_r3.glb Wave 0.6 assets/maniqui/previews/maniqui_v0_3_r3_wave.png
      - name: Separar vistas y acercamiento real
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path('assets/maniqui/previews')
          source=Image.open(root/'maniqui_v0_3_r3_4vistas.png').convert('RGB')
          assert source.size==(1680,640), source.size
          labels=['frontal','tres_cuartos','lateral','trasera']
          for i,label in enumerate(labels):
              panel=source.crop((i*420,0,(i+1)*420,640))
              panel.save(root/f'maniqui_v0_3_r3_{label}.png')
              head=panel.crop((35,30,385,325)).resize((700,590),Image.Resampling.LANCZOS)
              head.save(root/f'maniqui_v0_3_r3_cabeza_{label}.png')
          print('Generados 4 PNG separados, 4 acercamientos, lámina y pose Wave a partir de r3.glb')
          PY
      - name: Conservar evidencia en rama
        run: |
          git config user.name "COPOX CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maniqui/previews/maniqui_v0_3_r3_*.png docs/MANIQUI_V03_R3_REPRODUCCION_ARGOS_2026-10-14.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(maniqui): renders reales 4 vistas, cabeza y Wave de r3"
            git push origin HEAD:evidencia/maniqui-v03-r3-png
          fi
