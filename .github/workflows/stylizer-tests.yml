name: Stylizer · Python y contrato ALTH

on:
  pull_request:
    paths:
      - "tools/stylizer/**"
      - ".github/workflows/stylizer-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/stylizer/**"
      - ".github/workflows/stylizer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/stylizer/requirements.txt
      - name: Verificar sintaxis Python
        run: python -m compileall -q tools/stylizer
      - name: Instalar dependencias abiertas de Stylizer
        run: python -m pip install -r tools/stylizer/requirements.txt
      - name: Ejecutar pruebas del módulo aislado
        working-directory: tools/stylizer
        env:
          STYLIZER_PROMPT_MODE: template
          GRADIO_ANALYTICS_ENABLED: "False"
          NO_PROXY: localhost,127.0.0.1
        run: python -m unittest discover -s tests -v
